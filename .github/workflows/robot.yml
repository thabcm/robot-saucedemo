name: Robot Framework Automated Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar Dependências do Projeto
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Inicializar Driver do Browser
        run: |
          rfbrowser init

      - name: Executar Testes em Modo Headless
        run: |
          robot -v HEADLESS:true -d ./logs tests/

      - name: Armazenar Relatórios e Evidências dos Testes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: robot-test-reports
          path: logs/